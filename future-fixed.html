<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Наша Вселенная 🌌</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #000;
  overflow: hidden;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

/* Основной градиентный фон с анимацией */
.galaxy-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(ellipse at 40% 50%, #4a1d6d, #1a0b2e, #0a0519, #000);
  z-index: 0;
  animation: galaxyPulse 15s ease-in-out infinite;
}

@keyframes galaxyPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.05); }
}

/* Второй слой градиента для глубины */
.galaxy-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: radial-gradient(circle at 70% 30%, rgba(255, 100, 150, 0.2) 0%, transparent 40%),
              radial-gradient(circle at 20% 80%, rgba(100, 200, 255, 0.15) 0%, transparent 40%),
              radial-gradient(circle at 80% 70%, rgba(255, 200, 100, 0.1) 0%, transparent 50%);
  mix-blend-mode: screen;
  animation: overlayFloat 20s ease-in-out infinite;
  z-index: 1;
}

@keyframes overlayFloat {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 0.8; }
}

/* Туманные слои */
.fog {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><defs><filter id="fog"><feTurbulence baseFrequency="0.01" numOctaves="3" result="turbulence"/><feColorMatrix in="turbulence" mode="saturate" values="0"/></filter></defs><rect width="100" height="100" filter="url(%23fog)" fill="white"/></svg>');
  background-size: cover;
  opacity: 0.15;
  mix-blend-mode: screen;
  animation: fogMove 40s linear infinite;
  z-index: 2;
  pointer-events: none;
}

.fog2 {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" opacity="0.1"><defs><filter id="fog2"><feTurbulence baseFrequency="0.008" numOctaves="4" result="turbulence"/><feColorMatrix in="turbulence" mode="saturate" values="0"/></filter></defs><rect width="100" height="100" filter="url(%23fog2)" fill="white"/></svg>');
  background-size: cover;
  opacity: 0.1;
  mix-blend-mode: screen;
  animation: fogMove2 60s linear infinite reverse;
  z-index: 3;
  pointer-events: none;
}

@keyframes fogMove {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.5) translate(-10%, -10%); }
}

@keyframes fogMove2 {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.8) translate(15%, 15%); }
}

/* Звёзды (основной слой) */
.stars {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 4;
  pointer-events: none;
}

.star {
  position: absolute;
  background: white;
  border-radius: 50%;
  box-shadow: 0 0 20px white;
  animation: twinkle 4s ease-in-out infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 30px gold, 0 0 60px rgba(255, 215, 0, 0.5); }
}

/* Падающие звёзды */
.shooting-star {
  position: fixed;
  top: -10px;
  width: 3px;
  height: 100px;
  background: linear-gradient(180deg, gold, rgba(255, 255, 255, 0));
  transform: rotate(20deg);
  filter: blur(1px);
  animation: shoot 6s linear infinite;
  z-index: 5;
  opacity: 0;
  pointer-events: none;
}

@keyframes shoot {
  0% { transform: translateX(0) translateY(0) rotate(20deg); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translateX(-500px) translateY(500px) rotate(20deg); opacity: 0; }
}

/* Canvas для частиц */
#clickCanvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 20;
}

/* Основная карточка (стекло) */
.glass-card {
  position: relative;
  z-index: 10;
  max-width: 600px;
  width: 90%;
  margin: 2rem auto;
  background: rgba(20, 10, 30, 0.2);
  backdrop-filter: blur(15px);
  -webkit-backdrop-filter: blur(15px);
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 32px;
  padding: 40px 30px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.1) inset,
              0 0 50px rgba(255, 215, 0, 0.3);
  animation: cardFloat 8s ease-in-out infinite;
  transform-style: preserve-3d;
}

@keyframes cardFloat {
  0%, 100% { transform: translateY(0) rotate(0deg); }
  25% { transform: translateY(-5px) rotate(0.3deg); }
  75% { transform: translateY(5px) rotate(-0.3deg); }
}

/* Шапка карточки */
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
  padding-bottom: 15px;
  border-bottom: 1px solid rgba(255, 215, 0, 0.3);
}

.site-name {
  font-size: 18px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.95);
  text-shadow: 0 0 15px gold, 0 0 30px rgba(255, 215, 0, 0.5);
  letter-spacing: 1px;
}

.theme-switch {
  width: 60px;
  height: 30px;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 30px;
  border: 1px solid rgba(255, 215, 0, 0.5);
  position: relative;
  cursor: pointer;
  transition: 0.3s;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

.theme-switch:before {
  content: '🌙';
  position: absolute;
  left: 5px;
  top: 2px;
  font-size: 18px;
  transition: 0.3s;
  filter: drop-shadow(0 0 5px gold);
}

.theme-switch.active:before {
  transform: translateX(30px);
  content: '☀️';
}

/* Заголовок */
.galaxy-title {
  font-size: 42px;
  font-weight: 800;
  text-align: center;
  margin-bottom: 15px;
  background: linear-gradient(135deg, #ffd700, #ff69b4, #7fffd4, #ffd700);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 300% 300%;
  animation: titleGradient 6s ease infinite;
  text-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
  letter-spacing: 2px;
}

@keyframes titleGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

/* Подзаголовок */
.galaxy-subtitle {
  text-align: center;
  color: rgba(255, 255, 255, 0.9);
  font-size: 18px;
  margin-bottom: 40px;
  font-style: italic;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
  animation: subtitleGlow 3s ease-in-out infinite;
}

@keyframes subtitleGlow {
  0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }
  50% { text-shadow: 0 0 20px gold, 0 0 30px rgba(255, 215, 0, 0.5); }
}

/* Текст-послание */
.message {
  background: rgba(0, 0, 0, 0.3);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 215, 0, 0.3);
  border-radius: 24px;
  padding: 30px;
  margin-bottom: 40px;
  box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 215, 0, 0.2) inset;
}

.message p {
  color: rgba(255, 255, 255, 0.95);
  font-size: 20px;
  line-height: 1.8;
  text-align: center;
  margin: 0;
  white-space: pre-line;
  animation: messageAppear 2s ease-out;
}

@keyframes messageAppear {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Финальная кнопка */
.final-button {
  display: block;
  width: fit-content;
  margin: 0 auto 30px;
  padding: 18px 50px;
  background: linear-gradient(135deg, rgba(255, 77, 77, 0.8), rgba(179, 0, 0, 0.8));
  backdrop-filter: blur(5px);
  border: 2px solid gold;
  border-radius: 50px;
  color: white;
  font-size: 22px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 3px;
  cursor: pointer;
  transition: 0.3s;
  animation: buttonPulse 2s ease-in-out infinite;
  box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
  text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}

.final-button:active {
  transform: scale(0.95);
}

@keyframes buttonPulse {
  0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
  50% { transform: scale(1.05); box-shadow: 0 0 60px gold, 0 0 120px rgba(255, 77, 77, 0.5); }
}

/* Нижний текст */
.ps {
  text-align: center;
  color: rgba(255, 255, 255, 0.8);
  font-size: 16px;
  font-style: italic;
  text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
  animation: psGlow 4s ease-in-out infinite;
}

@keyframes psGlow {
  0%, 100% { text-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
  50% { text-shadow: 0 0 20px gold, 0 0 40px rgba(255, 215, 0, 0.3); }
}
</style>
</head>
<body>
  <!-- Фоновые слои -->
  <div class="galaxy-bg"></div>
  <div class="galaxy-overlay"></div>
  <div class="fog"></div>
  <div class="fog2"></div>
  
  <!-- Звёзды (300 штук) -->
  <div class="stars" id="stars"></div>
  
  <!-- Падающие звёзды -->
  <div class="shooting-star" style="left: 20%; animation-delay: 0s;"></div>
  <div class="shooting-star" style="left: 40%; animation-delay: 2s;"></div>
  <div class="shooting-star" style="left: 60%; animation-delay: 4s;"></div>
  <div class="shooting-star" style="left: 80%; animation-delay: 1s;"></div>
  <div class="shooting-star" style="left: 10%; animation-delay: 5s;"></div>
  
  <!-- Canvas для частиц -->
  <canvas id="clickCanvas"></canvas>
  
  <!-- Карточка -->
  <div class="glass-card">
    <div class="card-header">
      <span class="site-name">IloveYou4Ever.ru</span>
      <div class="theme-switch" id="themeToggle" onclick="toggleTheme()"></div>
    </div>
    
    <h1 class="galaxy-title">Our Universe</h1>
    <div class="galaxy-subtitle">written in the stars</div>
    
    <div class="message">
      <p id="messageText">
        ✨ Тысячи световых лет, миллиарды звёзд,<br>
        и среди них — одна, самая яркая.<br>
        Это ты.<br><br>
        Я нашёл тебя в бескрайнем космосе<br>
        и больше никогда не отпущу.<br><br>
        Наша любовь — это целая вселенная.<br>
        И это только начало...
      </p>
    </div>
    
    <button class="final-button" onclick="createGalaxyExplosion()" id="finalBtn">
      ✦ INFINITY ✦
    </button>
    
    <div class="ps">P. S. Your Soulmate ❤️‍🔥</div>
  </div>

<script>
// Генерация 300 звёзд
function createStars() {
  const starsContainer = document.getElementById('stars');
  const starCount = 300;
  
  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.className = 'star';
    
    const size = Math.random() * 4 + 1;
    const x = Math.random() * 100;
    const y = Math.random() * 100;
    const duration = Math.random() * 4 + 2;
    const delay = Math.random() * 5;
    
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    star.style.left = x + '%';
    star.style.top = y + '%';
    star.style.animationDuration = duration + 's';
    star.style.animationDelay = delay + 's';
    
    starsContainer.appendChild(star);
  }
}

// Частицы при клике
const canvas = document.getElementById('clickCanvas');
const ctx = canvas.getContext('2d');
let particles = [];

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 8;
    this.vy = (Math.random() - 0.5) * 8;
    this.size = Math.random() * 8 + 4;
    this.color = `hsl(${Math.random() * 60 + 300}, 100%, 70%)`;
    this.life = 1;
  }
  
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.life -= 0.01;
    this.size *= 0.99;
  }
  
  draw() {
    ctx.globalAlpha = this.life;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.fill();
    ctx.shadowColor = 'gold';
    ctx.shadowBlur = 15;
  }
}

function addParticles(e) {
  const rect = canvas.getBoundingClientRect();
  let x, y;
  
  if (e.touches) {
    x = e.touches[0].clientX - rect.left;
    y = e.touches[0].clientY - rect.top;
  } else {
    x = e.clientX - rect.left;
    y = e.clientY - rect.top;
  }
  
  for (let i = 0; i < 12; i++) {
    particles.push(new Particle(x, y));
  }
}

function animateParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  for (let i = particles.length - 1; i >= 0; i--) {
    particles[i].update();
    particles[i].draw();
    
    if (particles[i].life <= 0 || particles[i].size <= 0.1) {
      particles.splice(i, 1);
    }
  }
  
  requestAnimationFrame(animateParticles);
}

animateParticles();

document.addEventListener('click', addParticles);
document.addEventListener('touchstart', addParticles);

// Взрыв галактики
function createGalaxyExplosion() {
  for (let i = 0; i < 50; i++) {
    setTimeout(() => {
      const fakeEvent = {
        clientX: window.innerWidth / 2 + (Math.random() - 0.5) * 400,
        clientY: window.innerHeight / 2 + (Math.random() - 0.5) * 200
      };
      addParticles(fakeEvent);
    }, i * 30);
  }
  
  const btn = document.getElementById('finalBtn');
  btn.textContent = '✦ FOREVER ✦';
  setTimeout(() => {
    btn.textContent = '✦ INFINITY ✦';
  }, 2000);
}

// Переключение темы
function toggleTheme() {
  const toggle = document.getElementById('themeToggle');
  toggle.classList.toggle('active');
  
  if (toggle.classList.contains('active')) {
    document.body.style.filter = 'hue-rotate(30deg) brightness(1.2)';
  } else {
    document.body.style.filter = 'none';
  }
}

window.onload = function() {
  createStars();
  
  setInterval(() => {
    const stars = document.querySelectorAll('.star');
    const randomStar = stars[Math.floor(Math.random() * stars.length)];
    if (randomStar) {
      randomStar.style.animation = 'none';
      randomStar.offsetHeight;
      randomStar.style.animation = 'twinkle 4s ease-in-out infinite';
    }
  }, 2000);
};
</script>
</body>
</html>
